name: Release CocoaPod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.0 without v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-cocoapod-${{ inputs.version }}
  cancel-in-progress: false  # Never cancel during release

jobs:
  release-cocoapod:
    name: "📦 Release CocoaPod"
    runs-on: macos-26
    environment: release-cocoapods
    steps:
      - name: Checkout main for config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Extract module config
        id: config
        run: |
          MODULE="common"
          MODULE_CONFIG=$(jq -e '.common' .github/modules.json)

          if [ -z "$MODULE_CONFIG" ] || [ "$MODULE_CONFIG" = "null" ]; then
            echo "ERROR: Module 'common' not found in .github/modules.json"
            exit 1
          fi

          TAG_PREFIX=$(echo "$MODULE_CONFIG" | jq -r '.tag_prefix')
          FULL_TAG="${TAG_PREFIX}${{ inputs.version }}"

          echo "full_tag=$FULL_TAG" >> $GITHUB_OUTPUT
          echo "podspec=$(echo "$MODULE_CONFIG" | jq -r '.podspec')" >> $GITHUB_OUTPUT
          echo "version_files=$(echo "$MODULE_CONFIG" | jq -c '.version_files // []')" >> $GITHUB_OUTPUT

      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: refs/tags/${{ steps.config.outputs.full_tag }}
          fetch-depth: 0

      - name: Verify tag exists
        run: |
          FULL_TAG="${{ steps.config.outputs.full_tag }}"

          if ! git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "ERROR: Current commit is not tagged with $FULL_TAG"
            echo ""
            echo "Make sure you've run the 'Release SPM' workflow first."
            echo "It creates the tag that this workflow needs."
            exit 1
          fi

          CURRENT_TAG=$(git describe --exact-match --tags HEAD)
          if [ "$CURRENT_TAG" != "$FULL_TAG" ]; then
            echo "ERROR: Tag mismatch"
            echo "  Expected: $FULL_TAG"
            echo "  Found: $CURRENT_TAG"
            exit 1
          fi

          echo "✓ Checked out tag: $CURRENT_TAG"

      - name: Extract and validate podspec version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          PODSPEC="${{ steps.config.outputs.podspec }}"
          FULL_TAG="${{ steps.config.outputs.full_tag }}"

          # Extract version from podspec
          PODSPEC_VERSION_LINE=$(grep -E "s.version[[:space:]]*=[[:space:]]*'[0-9]+\.[0-9]+\.[0-9]+'" "$PODSPEC" || true)
          if [ -z "$PODSPEC_VERSION_LINE" ]; then
            echo "ERROR: Could not extract version from $PODSPEC"
            exit 1
          fi
          PODSPEC_VERSION=$(printf '%s\n' "$PODSPEC_VERSION_LINE" | sed -E "s/.*'([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/")

          echo "Input version: $INPUT_VERSION"
          echo "Podspec version: $PODSPEC_VERSION"

          # Validate each version file from modules.json
          echo '${{ steps.config.outputs.version_files }}' | jq -r '.[]' | while read -r FILE; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Version file not found: $FILE"
              exit 1
            fi

            FILE_VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' "$FILE" | head -1)

            if [ -z "$FILE_VERSION" ]; then
              echo "ERROR: Could not extract version from $FILE"
              exit 1
            fi

            echo "✓ $FILE: $FILE_VERSION"
          done

          if [ "$PODSPEC_VERSION" != "$INPUT_VERSION" ]; then
            echo ""
            echo "ERROR: Version mismatch between input and podspec"
            echo "  Input version: $INPUT_VERSION"
            echo "  Podspec version: $PODSPEC_VERSION"
            echo ""
            echo "The tag $FULL_TAG exists but contains version $PODSPEC_VERSION in the podspec."
            echo "This is a critical error - versions must match exactly."
            exit 1
          fi

          echo "✓ Podspec version matches input version"

      - name: Validate podspec
        run: |
          # Install CocoaPods
          gem install cocoapods

          PODSPEC="${{ steps.config.outputs.podspec }}"

          # Use spec lint (validates against the published tag)
          pod spec lint "$PODSPEC" --allow-warnings

      - name: Publish to CocoaPods
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "ERROR: COCOAPODS_TRUNK_TOKEN secret not found"
            echo ""
            echo "Make sure the secret is configured in the 'release-cocoapods' environment."
            exit 1
          fi

          PODSPEC="${{ steps.config.outputs.podspec }}"

          echo "Publishing $PODSPEC to CocoaPods trunk..."
          pod trunk push "$PODSPEC" --allow-warnings

          echo "✓ Published to CocoaPods trunk"

      - name: CocoaPod release complete
        run: |
          FULL_TAG="${{ steps.config.outputs.full_tag }}"

          echo "✅ MixpanelSwiftCommon ${{ inputs.version }} published to CocoaPods!"
          echo ""
          echo "Final step:"
          echo "  - Manually publish the draft GitHub Release at: https://github.com/${{ github.repository }}/releases/tag/$FULL_TAG"
          echo ""
          echo "The package is now available via:"
          echo "  - Swift Package Manager (SPM)"
          echo "  - CocoaPods"
